spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mediscan?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    mongodb:
      uri: mongodb://localhost:27017/mediscan
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

de:
  flapdoodle:
    mongodb:
      embedded:
        enabled: false # Disable embedded for CI, use real one
