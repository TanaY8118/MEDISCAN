spring:
  datasource:
    url: jdbc:h2:mem:mediscantest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  # Flapdoodle auto-configures an embedded MongoDB; we still need to
  # specify a URI so Spring Boot's auto-config doesn't fail on startup
  # before Flapdoodle can replace it.  The host/port here are overridden
  # at runtime by the Flapdoodle starter.
  data:
    mongodb:
      uri: mongodb://localhost/test
      auto-index-creation: true

de:
  flapdoodle:
    mongodb:
      embedded:
        version: "5.0.5"

# Fixed 256-bit secret for deterministic JWT generation in tests
jwt:
  secret: "test-secret-key-01234567890123456789012345678901"
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.mediscan: WARN
    org.springframework.web: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
