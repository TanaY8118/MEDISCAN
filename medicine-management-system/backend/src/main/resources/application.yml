server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: mediscan-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/mediscan}
    username: ${MYSQL_USER:mediscan_user}
    password: ${MYSQL_PASSWORD:mediscan_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://root:rootpassword@localhost:27017/mediscan?authSource=admin}

logging:
  level:
    com.mediscan: DEBUG
    org.springframework.web: INFO

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# Application Info
info:
  app:
    name: MediScan Backend
    version: 1.0.0
    description: Mobile-first medicine management system
